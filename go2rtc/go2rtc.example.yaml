# Streams are managed dynamically by HomeDVR API (SQLite → go2rtc).
# Do not put camera RTSP credentials here for normal use.
#
# First install:
#   cp go2rtc/go2rtc.example.yaml go2rtc/go2rtc.yaml

api:
  listen: ":1984"
  origin: "*"

rtsp:
  listen: ":8554"

webrtc:
  # LAN WebRTC only; external access uses MSE/HLS via Cloudflare Tunnel
  listen: ":8555"
