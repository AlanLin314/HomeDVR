# HomeDVR — single container
# Joins external network "home-net" so your EXISTING cloudflared can reach it.
#
# Cloudflare Dashboard Public Hostname service URL:
#   http://homedvr:8080
#
# Do NOT start a second cloudflared here if you already have one on home-net.
name: homedvr

services:
  homedvr:
    build:
      context: ${HOMEDVR_HOST_PATH:-.}
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
        GIT_SHA: ${GIT_SHA:-dev}
    image: homedvr:latest
    container_name: homedvr
    restart: unless-stopped
    ports:
      # LAN: http://主機IP:8080
      - "${HOMEDVR_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_PATH: /data/homedvr.db
      GO2RTC_URL: http://127.0.0.1:1984
      # Used by UI cloud icon (your public hostname)
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ENABLE_WEB_UPDATE: ${ENABLE_WEB_UPDATE:-true}
      REPO_PATH: /repo
      UPDATE_SCRIPT: /repo/scripts/update.sh
      CHECK_UPDATE_SCRIPT: /repo/scripts/check-update.sh
      COMPOSE_PROJECT_NAME: homedvr
      HOMEDVR_HOST_PATH: ${HOMEDVR_HOST_PATH:-}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      GIT_SHA: ${GIT_SHA:-dev}
    volumes:
      - ${HOMEDVR_HOST_PATH:-.}/data:/data
      - ${HOMEDVR_HOST_PATH:-.}:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - home-net

networks:
  default:
    name: homedvr_default
  # Must already exist: docker network create home-net
  home-net:
    external: true
    name: home-net
