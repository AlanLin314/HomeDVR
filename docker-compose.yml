# HomeDVR — single container; joins home-net for shared cloudflared
#
# HOMEDVR_HOST_PATH = absolute path on the DOCKER HOST (e.g. /root/HomeDVR).
name: homedvr

services:
  homedvr:
    build:
      context: ${HOMEDVR_HOST_PATH:-.}
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
        GIT_SHA: ${GIT_SHA:-dev}
    image: homedvr:latest
    container_name: homedvr
    restart: unless-stopped
    ports:
      - "${HOMEDVR_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_PATH: /data/homedvr.db
      GO2RTC_URL: http://127.0.0.1:1984
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ENABLE_WEB_UPDATE: ${ENABLE_WEB_UPDATE:-true}
      REPO_PATH: /repo
      UPDATE_SCRIPT: /repo/scripts/update.sh
      CHECK_UPDATE_SCRIPT: /repo/scripts/check-update.sh
      COMPOSE_PROJECT_NAME: homedvr
      HOMEDVR_HOST_PATH: ${HOMEDVR_HOST_PATH:-}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      GIT_SHA: ${GIT_SHA:-dev}
    volumes:
      - ${HOMEDVR_HOST_PATH:-.}/data:/data
      - ${HOMEDVR_HOST_PATH:-.}:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - home-net

  # Built-in tunnel (optional). Prefer shared cloudflared on home-net if you already have one.
  # Start with:  docker compose --profile tunnel up -d
  # Or set in .env:  COMPOSE_PROFILES=tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: homedvr-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env for tunnel profile}
    depends_on:
      - homedvr
    networks:
      - home-net

networks:
  default:
    name: homedvr_default
  home-net:
    external: true
    name: home-net
