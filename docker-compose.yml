# HomeDVR — single container + optional cloudflared on home-net
#
# HOMEDVR_HOST_PATH = absolute path on the DOCKER HOST (e.g. /root/HomeDVR).
name: homedvr

services:
  homedvr:
    build:
      context: ${HOMEDVR_HOST_PATH:-.}
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
        GIT_SHA: ${GIT_SHA:-dev}
    image: homedvr:latest
    container_name: homedvr
    restart: unless-stopped
    ports:
      - "${HOMEDVR_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_PATH: /data/homedvr.db
      GO2RTC_URL: http://127.0.0.1:1984
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ENABLE_WEB_UPDATE: ${ENABLE_WEB_UPDATE:-true}
      REPO_PATH: /repo
      UPDATE_SCRIPT: /repo/scripts/update.sh
      CHECK_UPDATE_SCRIPT: /repo/scripts/check-update.sh
      COMPOSE_PROJECT_NAME: homedvr
      HOMEDVR_HOST_PATH: ${HOMEDVR_HOST_PATH:-}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      GIT_SHA: ${GIT_SHA:-dev}
    volumes:
      - ${HOMEDVR_HOST_PATH:-.}/data:/data
      - ${HOMEDVR_HOST_PATH:-.}:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - home-net

  # Always defined (no profile). Idle if TUNNEL_TOKEN empty so external
  # cloudflared on home-net can be used instead without crash-loop.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: homedvr-tunnel
    restart: unless-stopped
    depends_on:
      - homedvr
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$TUNNEL_TOKEN" ]; then
          echo "[cloudflared] TUNNEL_TOKEN empty — idle (use external tunnel on home-net, or set token)"
          exec tail -f /dev/null
        fi
        echo "[cloudflared] starting tunnel..."
        exec cloudflared tunnel --no-autoupdate run
    networks:
      - home-net

networks:
  default:
    name: homedvr_default
  home-net:
    external: true
    name: home-net
