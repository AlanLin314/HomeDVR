# HomeDVR — single container (API + UI + go2rtc)
# Joins external network "home-net" so existing cloudflared can reach it.
name: homedvr

services:
  homedvr:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
        GIT_SHA: ${GIT_SHA:-dev}
    image: homedvr:latest
    container_name: homedvr
    restart: unless-stopped
    ports:
      # LAN access: http://主機IP:8080
      - "${HOMEDVR_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_PATH: /data/homedvr.db
      GO2RTC_URL: http://127.0.0.1:1984
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ENABLE_WEB_UPDATE: ${ENABLE_WEB_UPDATE:-true}
      REPO_PATH: /repo
      UPDATE_SCRIPT: /repo/scripts/update.sh
      CHECK_UPDATE_SCRIPT: /repo/scripts/check-update.sh
      COMPOSE_PROJECT_NAME: homedvr
      APP_VERSION: ${APP_VERSION:-0.1.0}
      GIT_SHA: ${GIT_SHA:-dev}
    volumes:
      - ./data:/data
      - .:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - home-net

  # Only if you do NOT already have a shared cloudflared on home-net
  # docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: homedvr-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - homedvr
    networks:
      - home-net

networks:
  default:
    name: homedvr_default
  # Must already exist (or create once: docker network create home-net)
  home-net:
    external: true
    name: home-net
